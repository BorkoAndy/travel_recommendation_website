<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TravelBloom</title>
    <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>

    <!-- ========== Navbar (no search bar on this page) ========== -->
    <nav class="navbar">
        <a class="brand" href="travel_recommendation.html">
            <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
                <rect x="1" y="1" width="38" height="38" rx="4" fill="#fff"/>
                <path d="M8 28 L16 14 L22 22 L26 17 L32 28 Z" fill="#12323d"/>
                <circle cx="29" cy="11" r="3" fill="#12323d"/>
            </svg>
            <span class="brand-name">TravelBloom</span>
        </a>

        <ul class="nav-links">
            <li><a href="travel_recommendation.html">Home</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="contact_us.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- ========== Contact section ========== -->
    <main class="contact-page">
        <h1>Contact Us</h1>
        <p class="contact-intro">
            Have a question or need help planning your trip? Send us a message
            and we'll get back to you as soon as we can.
        </p>

        <form class="contact-form" id="contactForm" action="#" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

            <button type="submit" class="submit-btn">Submit</button>
            <p class="form-status" id="formStatus" role="status"></p>
        </form>
    </main>

    <script>
        // Demo behaviour: there is no backend yet, so just confirm and reset.
        document.getElementById('contactForm').addEventListener('submit', function (event) {
            event.preventDefault();
            document.getElementById('formStatus').textContent =
                'Thank you! Your message has been sent.';
            this.reset();
        });
    </script>

</body>
</html>
